
name: Ecommerce API Tests

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test environment
        run: |
          echo 'DATABASE_URL="postgresql://postgres:postgres@localhost:5432/ecommerce_db"' > .env
          echo 'JWT_SECRET="test_secret_for_ci_only"' >> .env
          echo 'PORT=3000' >> .env

      - name: Run automated tests
        run: npm test
